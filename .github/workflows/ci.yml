
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. DETECT CHANGED FILES
  # ==========================================
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}

    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Detect changed files
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'main.py'
              - 'models.py'
              - 'database.py'
              - 'requirements.txt'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

            migrations:
              - 'migrations/**'
              - 'models.py'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'

  # ==========================================
  # 2. PYTHON CI
  # ==========================================
  test-backend:
    name: Python CI - Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lab4_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab4_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/lab4_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d lab4_db; then
              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL... $i/30"
            sleep 2
          done

          echo "PostgreSQL connection failed!"
          exit 1

      - name: Run database migrations
        run: python -m migrations.main

      - name: Run pytest
        run: pytest -v

  # ==========================================
  # 3. DOCKER BACKEND PACK AND PUSH
  # ==========================================
  docker-backend:
    name: Docker Backend Pack and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.changes.outputs.backend == 'true'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            artur310/lab1-api:latest
            artur310/lab1-api:${{ github.sha }}

  # ==========================================
  # 4. DOCKER FRONTEND PACK AND PUSH
  # ==========================================
  docker-frontend:
    name: Docker Frontend Pack and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/bugfix/')
        ) &&
        needs.changes.outputs.frontend == 'true'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # MAIN - PUSH TO DOCKER HUB
      # ----------------------------------------
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            artur310/lab1-frontend:latest
            artur310/lab1-frontend:${{ github.sha }}

      # ----------------------------------------
      # FEATURE / BUGFIX - EXPORT ARTIFACT
      # ----------------------------------------
      - name: Build Frontend and Export Docker Artifact
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/frontend-image.tar
          tags: artur310/lab1-frontend:${{ github.sha }}

      - name: Upload Frontend Docker Artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: /tmp/frontend-image.tar

  # ==========================================
  # 5. DOCKER MIGRATIONS PACK AND PUSH
  # ==========================================
  docker-migrations:
    name: Docker Migrations Pack and Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - changes

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.changes.outputs.migrations == 'true'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Migrations Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./migrations/Dockerfile
          push: true
          tags: |
            artur310/lab1-migrations:latest
            artur310/lab1-migrations:${{ github.sha }}

  # ==========================================
  # 6. PIPELINE SUMMARY
  # ==========================================
  pipeline-summary:
    name: CI/CD Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - docker-backend
      - docker-frontend
      - docker-migrations

    if: always()

    steps:
      - name: Display Pipeline Results
        run: |
          echo "======================================"
          echo "          CI/CD PIPELINE"
          echo "======================================"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Docker Backend: ${{ needs.docker-backend.result }}"
          echo "Docker Frontend: ${{ needs.docker-frontend.result }}"
          echo "Docker Migrations: ${{ needs.docker-migrations.result }}"
          echo "======================================"
