name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. BACKEND TESTS
  # ==========================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lab4_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab4_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/lab4_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python -c "import time, psycopg2; \
          for i in range(30): \
              try: \
                  psycopg2.connect('postgresql://postgres:postgres@localhost:5432/lab4_db').close(); \
                  print('PostgreSQL is ready'); \
                  break; \
              except psycopg2.OperationalError: \
                  time.sleep(2); \
          else: \
              raise SystemExit('PostgreSQL connection failed')"

      - name: Run database migrations
        run: python -m migrations.main

      - name: Run backend tests
        run: pytest -v

  # ==========================================
  # 2. FRONTEND BUILD
  # ==========================================
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  # ==========================================
  # 3. DOCKER BUILD AND PUSH
  # ==========================================
  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test-backend
      - build-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Docker Hub Authentication
      # ----------------------------------------
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------
      # Backend Docker Image
      # ----------------------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            artur310/lab1-api:latest
            artur310/lab1-api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------
      # Frontend Docker Image
      # ----------------------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            artur310/lab1-frontend:latest
            artur310/lab1-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ----------------------------------------
      # Database Migrations Docker Image
      # ----------------------------------------
      - name: Build and Push Migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./migrations/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            artur310/lab1-migrations:latest
            artur310/lab1-migrations:${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: CI/CD Pipeline Completed
        run: echo "All tests passed and Docker images were built successfully!"
