
name: Docker Frontend Pack and Push

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
    paths:
      - 'frontend/**'
      - '.github/workflows/docker-frontend.yml'

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            artur310/lab1-frontend:latest
            artur310/lab1-frontend:${{ github.sha }}

      - name: Build Frontend and Export Docker Artifact
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/frontend-image.tar
          tags: artur310/lab1-frontend:${{ github.sha }}

      - name: Upload Frontend Docker Artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: /tmp/frontend-image.tar
