name: Docker Pack and Push Reusable

on:
  workflow_call:
    inputs:
      repository_name:
        description: 'Назва репозиторію в Docker Hub'
        required: true
        type: string
      image_tag:
        description: 'Тег Docker-образу'
        required: true
        type: string
      push_to_hub:
        description: 'Параметр для перевірки гілки main'
        required: true
        type: boolean
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.push_to_hub == true }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        if: ${{ inputs.push_to_hub == true }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.repository_name }}:${{ inputs.image_tag }}

      - name: Build and Export to Artifact
        if: ${{ inputs.push_to_hub == false }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/docker-image.tar
          tags: ${{ inputs.repository_name }}:${{ inputs.image_tag }}

      - name: Upload Artifact
        if: ${{ inputs.push_to_hub == false }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar