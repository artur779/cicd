
services:
  db:
    image: postgres:16
    container_name: lab4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab4_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab4_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
