
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab4.fullname" . }}-backend
  labels:
    {{- include "lab4.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "lab4.fullname" . }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
