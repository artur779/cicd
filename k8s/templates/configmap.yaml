
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab4.fullname" . }}-config
  labels:
    {{- include "lab4.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  DATABASE_HOST: {{ include "lab4.fullname" . }}-postgres
  DATABASE_PORT: {{ .Values.postgres.port | quote }}
