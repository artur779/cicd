
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab4.fullname" . }}-postgres
  labels:
    {{- include "lab4.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ include "lab4.fullname" . }}-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: 5432
