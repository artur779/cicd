
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lab4.fullname" . }}-postgres-pvc
  labels:
    {{- include "lab4.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
